name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Runs on semantic tags like v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Set up QEMU (for ARM builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build multi-platform Docker images
        run: |
          IMAGE_NAME="ghcr.io/lexluthr/piece-server"
          VERSION="${GITHUB_REF#refs/tags/}"  # Extract version from tag
          MAJOR="${VERSION%%.*}"  # Extract major version
          # Build multi-platform images and push them
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$VERSION \
            -t $IMAGE_NAME:$MAJOR \
            --push .

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
