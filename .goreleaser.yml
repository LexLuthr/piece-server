# .goreleaser.yml
project_name: piece-server

release:
  github:
    owner: LexLuthr
    name: piece-server
    # set false if you want the release published (not as a draft)
    draft: false

builds:
  - binary: piece-server
    main: ./main.go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w"

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

docker:
  - image_templates:
      - "ghcr.io/LexLuthr/piece-server:latest"
      - "ghcr.io/LexLuthr/piece-server:{{ .Tag }}"
    dockerfile: Dockerfile
    goos: linux
    goarch:
      - amd64
      - arm64
